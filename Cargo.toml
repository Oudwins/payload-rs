[workspace]
resolver = "2"
members = [
  "crates/payload-mongo-live-joins",
  "crates/payload-core-validate",
  "crates/payload-core-validate/live",
  "crates/payload-engine",
  "crates/payload-node",
  "crates/payload-sql-query",
  "crates/payload-sql-read",
  "crates/payload-sql-write",
  "crates/payload-sql-find",
  "crates/payload-sql-upsert",
  "crates/payload-sqlite",
  "crates/payload-core-query",
  "crates/payload-core-runtime",
  "crates/payload-core-hooks-change",
  "crates/payload-core-hooks-after",
  "crates/payload-core-hooks-validate",
  "crates/payload-core-ops",
  "crates/payload-core-ops-global",
  "crates/payload-core-ops-write",
  "crates/payload-sql-engine",
  "crates/payload-mongo-schema",
  "crates/payload-mongo-live-query",
  "crates/payload-mongo-live",
  "crates/payload-mongo-live-write",
  "crates/payload-mongo-live-transform",
  "crates/payload-mongo-driver",
  "crates/payload-fn-ir",
  "crates/payload-fuse",
  "crates/payload-fuse-sqlite",
  "crates/payload-fuse-mongo",
  "crates/payload-fuse-write",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }

[profile.release]
lto = "thin"

# rusqlite's SQLite is the libSQL build of the reference runtime
# (@libsql/client 0.14.0 -> libsql 0.4.7 -> libsql-ffi 0.4.1 multiple-ciphers).
[patch.crates-io]
libsqlite3-sys = { path = "crates/payload-sqlite/libsqlite3-sys" }
