# Prebuilt @payloadcms/engine-rs addons and the release tarballs (RUST_PORT.md, "Packaging").
#
# Each target builds natively on its own runner (libsql-ffi runs cmake + bindgen, which need a
# C toolchain, cmake and libclang for the target; cross-compiling them is not set up). The `pack`
# job runs packages/engine-rs/scripts/release/packRelease.mjs over all artifacts and uploads the
# tarballs. Publishing is deliberately not part of this workflow.
name: engine-rs-prebuild

on:
  workflow_dispatch:
  push:
    tags:
      - 'engine-rs-v*'

permissions:
  contents: read

jobs:
  addon:
    name: addon ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-22.04 # glibc 2.35: the oldest glibc the addon then requires
          - platform: linux-arm64-gnu
            runner: ubuntu-22.04-arm
          - platform: linux-x64-musl
            runner: ubuntu-latest
            container: node:24-alpine
          - platform: linux-arm64-musl
            runner: ubuntu-24.04-arm
            container: node:24-alpine
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x64
            runner: macos-13
          - platform: win32-x64-msvc
            runner: windows-latest
    steps:
      - name: Install build tools (alpine)
        if: matrix.container == 'node:24-alpine'
        run: apk add --no-cache bash build-base cmake clang-dev git rust cargo linux-headers
      - uses: actions/checkout@v5
      - name: Install build tools (ubuntu)
        if: runner.os == 'Linux' && matrix.container == ''
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Install build tools (macos)
        if: runner.os == 'macOS'
        run: brew install cmake
      - name: Install build tools (windows)
        if: runner.os == 'Windows'
        run: choco install -y cmake llvm
      - name: Rust toolchain
        if: matrix.container == ''
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build the addon
        shell: bash
        env:
          # a musl cdylib must link the C runtime dynamically
          RUSTFLAGS: ${{ contains(matrix.platform, 'musl') && '-C target-feature=-crt-static' || '' }}
        run: cargo build -p payload-node --release
      - name: Collect
        shell: bash
        run: |
          mkdir -p addons/${{ matrix.platform }}
          for lib in target/release/libpayload_node.so target/release/libpayload_node.dylib target/release/payload_node.dll; do
            if [ -f "$lib" ]; then cp "$lib" addons/${{ matrix.platform }}/payload-engine.node; fi
          done
          test -f addons/${{ matrix.platform }}/payload-engine.node
      - name: Smoke test (loads, reports its version)
        shell: bash
        run: node -e "const a=require('./addons/${{ matrix.platform }}/payload-engine.node'); console.log(a.version())"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: addon-${{ matrix.platform }}
          path: addons/${{ matrix.platform }}/payload-engine.node
          if-no-files-found: error

  pack:
    needs: addon
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Node and pnpm
        uses: ./.github/actions/setup
      - name: Build packages
        run: pnpm run build:all
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: addon-*
          path: addons-raw
      - name: Arrange addons as <platform>/payload-engine.node
        run: |
          mkdir -p addons
          for dir in addons-raw/addon-*; do
            platform="${dir#addons-raw/addon-}"
            mkdir -p "addons/$platform"
            cp "$dir/payload-engine.node" "addons/$platform/payload-engine.node"
          done
          ls -R addons
      - name: Pack
        run: node packages/engine-rs/scripts/release/packRelease.mjs --addons addons --out release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarballs
          path: release/*.tgz
          if-no-files-found: error
