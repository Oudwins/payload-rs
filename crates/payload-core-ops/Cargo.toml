[package]
name = "payload-core-ops"
edition.workspace = true
license.workspace = true
version.workspace = true

# Ports of the collection operations of packages/payload/src/collections/operations on the
# payload-core-runtime (strategy B: Rust drives the user's JS objects through Node-API on the JS
# thread). See RUST_OPS_DESIGN.md.

[dependencies]
napi = { version = "3", features = ["napi10"] }
payload-core-runtime = { path = "../payload-core-runtime" }
