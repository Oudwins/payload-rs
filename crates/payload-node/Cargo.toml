[package]
name = "payload-node"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["serde-json", "napi9"] }
napi-derive = "3"
payload-core-hooks-validate = { path = "../payload-core-hooks-validate" }
payload-core-hooks-after = { path = "../payload-core-hooks-after" }
payload-core-hooks-change = { path = "../payload-core-hooks-change" }
payload-core-ops = { path = "../payload-core-ops" }
payload-core-ops-global = { path = "../payload-core-ops-global" }
payload-core-ops-write = { path = "../payload-core-ops-write" }
payload-core-query = { path = "../payload-core-query" }
payload-core-runtime = { path = "../payload-core-runtime" }
payload-core-validate = { path = "../payload-core-validate" }
payload-core-validate-live = { path = "../payload-core-validate/live" }
payload-engine = { path = "../payload-engine" }
payload-mongo-live = { path = "../payload-mongo-live" }
payload-mongo-live-joins = { path = "../payload-mongo-live-joins" }
payload-mongo-live-write = { path = "../payload-mongo-live-write" }
payload-mongo-schema = { path = "../payload-mongo-schema" }
payload-mongo-live-query = { path = "../payload-mongo-live-query" }
payload-mongo-live-transform = { path = "../payload-mongo-live-transform" }
payload-mongo-driver = { path = "../payload-mongo-driver" }
payload-sql-engine = { path = "../payload-sql-engine" }
payload-sqlite = { path = "../payload-sqlite" }
serde_json.workspace = true

[build-dependencies]
napi-build = "2"
