[package]
name = "payload-mongo-query"
edition.workspace = true
license.workspace = true
version.workspace = true

# Port of `@payloadcms/db-mongodb`'s `queries/*` and `utilities/buildProjectionFromSelect.ts`:
# Payload where / sort / select + field config -> the mongo filter / sort / projection (and the
# `$lookup` sort stages) exactly as the TS hands them to mongoose. Database reads the TS code makes
# while building a filter (relationship / join sub-queries) go through `QueryHost`.

[dependencies]
indexmap.workspace = true
payload-engine = { path = "../payload-engine" }
payload-sql-query = { path = "../payload-sql-query" }
payload-sql-read = { path = "../payload-sql-read" }
serde_json.workspace = true
