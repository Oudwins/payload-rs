[package]
name = "payload-core-validate-live"
edition.workspace = true
license.workspace = true
version.workspace = true

# Payload's default field validators (`packages/payload/src/fields/validations.ts`) on live JS
# values: `src/shell.js` holds each validator's upstream signature and awaits, the natives here
# run the rest of the TS bodies through Node-API (payload-core-runtime's `js` wrappers).

[dependencies]
napi = { version = "3", features = ["napi10"] }
payload-core-runtime = { path = "../../payload-core-runtime" }
